[package]
name = "cmds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
# crates.io 的搜索结果只显示这一句，跟着 README 一起用英文，别中英混排
description = "A small, fast interactive shell: fish-style history suggestions, a Tab candidate menu, and a starship-style modular prompt"
readme = "../README.md"
keywords = ["shell", "prompt", "terminal", "completion", "history"]
categories = ["command-line-utilities"]

[[bin]]
name = "cmds"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
unicode-width = "0.2.2"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
