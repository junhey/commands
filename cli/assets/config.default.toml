# Commands (cmds) configuration
# Location: ~/.config/cmds/config.toml (Windows: %APPDATA%\cmds\config.toml)
# Every key is optional; omitting one keeps its default. Changes take effect
# immediately — the next prompt re-reads this file.

# ── Prompt ──────────────────────────────────────────────────────────────
# $module placeholders are replaced by that module's output; $line_break is a newline.
#
# $all is the first-line information area. Prefer it over spelling out every
# module: a hard-coded list never picks up modules added in later versions.
# Run `config show` to list every available module name.
format = "$all$line_break$container$shlvl$character"
# Right-hand prompt, drawn at the end of the same line, e.g. "$time"
right_format = ""
# Leave a blank line before each prompt; gives the output room to breathe
add_newline = true
# Continuation marker for multi-line input (unclosed quote or pipe)
continuation_symbol = "∙ "
continuation_style = "dimmed yellow"

[character]
success_symbol = "❯"
error_symbol = "❯"
success_style = "bold green"
error_style = "bold red"

[dir]
style = "bold cyan"
# Keep the last N path segments; 0 disables truncation
truncation_length = 3
truncation_symbol = "…/"
# Inside a git repository, start the path at the repo root
truncate_to_repo = true
home_symbol = "~"

[git]
enabled = true
# Empty by default so any font works; with a Nerd Font try " "
branch_symbol = ""
branch_style = "bold purple"
# Turn this off to avoid running `git status` in huge repositories
status_enabled = true
status_style = "bold red"
detached_symbol = "@"
# In-progress operations: REBASE 2/5, MERGING, CHERRY-PICKING, BISECTING.
# Worth keeping on — a branch name alone never tells you that you are
# halfway through a rebase.
state_enabled = true
state_style = "bold yellow"
# Short commit hash, off by default because the branch name usually says enough
commit_enabled = false
commit_style = "dimmed green"
commit_length = 7

[languages]
enabled = true
show_version = true
# Prefix for the combined $languages module, rendering as "via  v20.20.2".
# It only appears together with the content, so it never dangles.
prefix = "via "

# Each language can override symbol / style / enabled / files / extensions / version_cmd
[languages.rust]
symbol = "🦀 "
style = "bold red"

[languages.nodejs]
symbol = "⬢ "
style = "bold green"

[languages.python]
symbol = "🐍 "
style = "bold yellow"

[languages.golang]
symbol = "🐹 "
style = "bold cyan"

[languages.java]
symbol = "☕ "
style = "bold blue"

[cmd_duration]
enabled = true
# Only show the duration once a command takes longer than this
min_time_ms = 2000
style = "bold yellow"
prefix = "took "

[status]
enabled = true
style = "bold red"
symbol = "✘ "

[time]
enabled = false
style = "dimmed white"
# Hour offset from UTC; use 8 for UTC+8
utc_offset = 0
show_seconds = false

[identity]
# true / false / "auto". "auto" only shows the name when it is worth saying:
# root, an SSH session, or inside a container. Local everyday work stays clean,
# and a container or remote box labels itself automatically.
show_user = "auto"
show_host = "auto"
style = "bold green"
# root gets its own colour — it is a state you want to notice
root_style = "bold red"
host_symbol = "🌐 "
# Connector between the modules: "root in 🌐 box in repo".
# It belongs to the module, so a missing value never leaves a stray "in".
suffix = " in "

[container]
# Detects Docker / Podman / Dev Container / Codespaces / WSL and shows ⬢ [Docker].
# Environment variables and marker files only — no process is spawned.
# Set CMDS_CONTAINER=name to label an environment that cannot be detected.
enabled = true
symbol = "⬢"
style = "bold dimmed red"
show_name = true

[venv]
# Python virtualenv / conda environment, rendered as (project-name)
enabled = true
symbol = ""
style = "dimmed cyan"

[package]
# Version of the current project, read from package.json / Cargo.toml / pyproject.toml
enabled = false
symbol = "📦 "
style = "bold blue"

[shlvl]
# Nesting depth, for when you lose track of how many shells deep you are
enabled = false
symbol = "↕ "
style = "bold yellow"
threshold = 2

[os]
enabled = false
style = "bold white"

# ── Input (fish flavour) ────────────────────────────────────────────────
[autosuggest]
# Grey history suggestion as you type; → / End / Ctrl-F takes it
enabled = true
style = "dimmed"
# Order of suggestion sources: history, then completion (commands and paths)
sources = ["history", "completion"]

[menu]
# Tab opens the candidate menu; ↑/↓ selects, Enter accepts, Esc closes
enabled = true
max_rows = 8
max_candidates = 200
show_descriptions = true
# When several candidates share a prefix, insert that prefix first
auto_insert_common_prefix = true
selected_style = "bold fg:black bg:cyan"
description_style = "dimmed"
hint_style = "dimmed italic"

[history]
# Defaults to ~/.local/share/cmds/history (Windows: %LOCALAPPDATA%\cmds\history)
# file = "~/.cmds_history"
max_entries = 20000
dedup = true
# Commands starting with a space are not recorded
ignore_space = true
ignore_commands = ["exit", "clear"]

[highlight]
enabled = true
valid_command = "green"
invalid_command = "red"
string = "yellow"
operator = "purple"
variable = "cyan"
option = "bold blue"
comment = "dimmed"

# ── Aliases / abbreviations / environment ───────────────────────────────
[aliases]
ll = "ls -lah"
la = "ls -A"
gs = "git status"
gd = "git diff"
gl = "git log --oneline --graph --decorate -20"

# Abbreviations expand to the full command as soon as you press space (fish's abbr)
[abbreviations]
gco = "git checkout"
gcm = "git commit -m"
gp = "git push"

# Preset scripts show up in the candidate menu. Both the name and the command
# itself are matched, so "gst" and "git st" both find the entry — you do not
# have to remember the shorthand for it to be useful.
# Nothing destructive here on purpose: gclean is a dry run, drop the -n yourself.
[scripts]
gst = "git status --short --branch"
glog = "git log --oneline --graph --decorate -20"
gdiff = "git diff --stat"
gsync = "git pull --rebase --autostash"
gundo = "git reset --soft HEAD~1"
gclean = "git clean -nd"

# Subcommand completion: typing `git ` offers status / log / commit …
# 17 command tables ship built in (see `config show`). Add your own below, or
# override a built-in entry by reusing its name. Quote chains with spaces.
#
# [completions.git]
# st = "shorthand our team uses"
#
# [completions."git remote"]
# sync = "our deploy helper"

[env]
# EDITOR = "vim"
