# Commands (cmds) 配置文件
# 位置：~/.config/cmds/config.toml（Windows：%APPDATA%\cmds\config.toml）
# 所有键都可省略，省略即使用默认值。改完立即生效（新开的提示符会重新读取）。

# ── 提示符 ─────────────────────────────────────────────────────────────
# $module 占位符会被对应模块的输出替换；$line_break 表示换行。
format = "$identity$dir$git_branch$git_status$languages$cmd_duration$status$line_break$character"
# 右侧提示符（写在同一行的右端），例如 "$time"
right_format = ""
# 每次提示符前空一行，视觉上更松快
add_newline = true
# 多行输入（引号/管道未闭合）时的续行提示
continuation_symbol = "∙ "
continuation_style = "dimmed yellow"

[character]
success_symbol = "❯"
error_symbol = "❯"
success_style = "bold green"
error_style = "bold red"

[dir]
style = "bold cyan"
# 保留最后 N 级目录，0 表示不截断
truncation_length = 3
truncation_symbol = "…/"
# 在 git 仓库内时，从仓库根开始显示
truncate_to_repo = true
home_symbol = "~"

[git]
enabled = true
# 默认留空以兼容任意字体；装了 Nerd Font 可以改成 " "
branch_symbol = ""
branch_style = "bold purple"
# 关闭可以避免大仓库里执行 `git status`
status_enabled = true
status_style = "bold red"
detached_symbol = "@"

[languages]
enabled = true
show_version = true

# 每种语言都可以单独覆盖 symbol / style / enabled / files / extensions / version_cmd
[languages.rust]
symbol = "🦀 "
style = "bold red"

[languages.nodejs]
symbol = "⬢ "
style = "bold green"

[languages.python]
symbol = "🐍 "
style = "bold yellow"

[languages.golang]
symbol = "🐹 "
style = "bold cyan"

[languages.java]
symbol = "☕ "
style = "bold blue"

[cmd_duration]
enabled = true
# 超过这个毫秒数才显示耗时
min_time_ms = 2000
style = "bold yellow"
prefix = "took "

[status]
enabled = true
style = "bold red"
symbol = "✘ "

[time]
enabled = false
style = "dimmed white"
# 与 UTC 的小时偏移，东八区填 8
utc_offset = 0
show_seconds = false

[identity]
show_user = false
show_host = false
style = "bold dimmed green"

# ── 输入体验（fish 风味）─────────────────────────────────────────────
[autosuggest]
# 边打字边给出灰色的历史建议，→ / End / Ctrl-F 一键采纳
enabled = true
style = "dimmed"
# 建议来源顺序：history（历史）、completion（命令与路径补全）
sources = ["history", "completion"]

[menu]
# Tab 弹出候选菜单，↑/↓ 选择，Enter 采纳，Esc 关闭
enabled = true
max_rows = 8
max_candidates = 200
show_descriptions = true
# 多个候选有公共前缀时先补齐公共部分
auto_insert_common_prefix = true
selected_style = "bold fg:black bg:cyan"
description_style = "dimmed"
hint_style = "dimmed italic"

[history]
# 默认 ~/.local/share/cmds/history（Windows：%LOCALAPPDATA%\cmds\history）
# file = "~/.cmds_history"
max_entries = 20000
dedup = true
# 以空格开头的命令不写入历史
ignore_space = true
ignore_commands = ["exit", "clear"]

[highlight]
enabled = true
valid_command = "green"
invalid_command = "red"
string = "yellow"
operator = "purple"
variable = "cyan"
option = "bold blue"
comment = "dimmed"

# ── 别名 / 缩写 / 环境变量 ───────────────────────────────────────────
[aliases]
ll = "ls -lah"
la = "ls -A"
gs = "git status"
gd = "git diff"
gl = "git log --oneline --graph --decorate -20"

# 缩写：输入后按空格立即展开成完整命令（fish 的 abbr）
[abbreviations]
gco = "git checkout"
gcm = "git commit -m"
gp = "git push"

[env]
# EDITOR = "vim"
