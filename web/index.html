<!doctype html>
<!--
  这份静态外壳固定英文：它是搜索引擎、社交分享预览和 React 启动前首屏看到的内容，
  没有 JS 可用，做不了语言判断。中文环境下由 i18n.js 的 applyDocumentLang()
  在启动后改写 <html lang>、<title> 与 description。
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta
      name="description"
      content="Commands (cmds) — a small, fast interactive shell. History suggestions as you type, a Tab candidate menu, and a starship-style modular prompt. One executable, no runtime dependencies."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://junhey.github.io/commands/" />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Commands — a small, fast interactive shell"
    />
    <meta
      property="og:description"
      content="History autosuggest · Tab candidate menu · modular prompt. One executable, no runtime dependencies."
    />
    <meta property="og:url" content="https://junhey.github.io/commands/" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Commands — a small, fast interactive shell</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=IBM+Plex+Mono:wght@400;450;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      The Commands website needs JavaScript for the interactive Playground. To
      install:
      <code>curl -fsSL https://junhey.github.io/commands/install.sh | sh</code>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
