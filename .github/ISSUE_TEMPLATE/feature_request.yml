name: 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 请描述实际遇到的场景，而不是直接描述方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）

  - type: checkboxes
    id: scope
    attributes:
      label: 是否符合项目定位
      description: |
        cmds 面向交互使用，不追求成为 POSIX sh 的替代品
        （不打算支持函数、if/for 等脚本语法）。
      options:
        - label: 我确认这个建议属于交互体验的范畴
          required: true
