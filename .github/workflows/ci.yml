name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 检查格式
        run: cargo fmt --all --check

      - name: Clippy（警告视为错误）
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 单元测试
        run: cargo test --locked

      # 测试里有依赖进程当前目录的路径补全，重跑一次确认没有并行污染
      - name: 单元测试（单线程复跑）
        run: cargo test --locked -- --test-threads=1

      # 站点和 README 都在宣传「N 个单元测试」。写死的数字迟早变成假信息，
      # 所以只在 web/src/commands.js 的 BRAND.tests 留一份，这里用真实结果校验。
      - name: 宣传的测试数必须等于真实测试数
        if: runner.os == 'Linux'
        run: |
          set -eu
          actual=$(cargo test --locked 2>&1 \
            | sed -nE 's/^test result: ok\. ([0-9]+) passed.*/\1/p' \
            | awk '{ sum += $1 } END { print sum }')
          claimed=$(sed -nE 's/^[[:space:]]*tests: ([0-9]+),.*/\1/p' web/src/commands.js)
          if [ "$actual" != "$claimed" ]; then
            echo "::error::BRAND.tests 写的是 $claimed，实际有 $actual 个测试，请更新 web/src/commands.js"
            exit 1
          fi
          for f in README.md README.zh-CN.md; do
            grep -qE "$actual (unit tests|个单元测试)" "$f" \
              || { echo "::error file=$f::测试数不是 $actual，请同步"; exit 1; }
          done
          echo "宣传与实际一致：$actual 个单元测试"

      - name: Release 构建
        run: cargo build --release --locked

      # crates.io 只打包 crate 目录内的文件，所以 cli/ 下要自带一份 LICENSE。
      # 两份必须一致，否则发布出去的许可证会和仓库里的不一样。
      - name: cli/LICENSE 与根 LICENSE 必须一致
        if: runner.os == 'Linux'
        run: |
          set -eu
          if ! diff -q LICENSE cli/LICENSE; then
            echo "::error::cli/LICENSE 与根目录 LICENSE 不一致，请同步（cp LICENSE cli/LICENSE）"
            exit 1
          fi
          echo "两份 LICENSE 一致"

      - name: 校验 crates.io 打包
        if: runner.os == 'Linux'
        run: |
          cargo publish --dry-run -p cmds --locked
          # README 与 LICENSE 必须在包里，否则 crates.io 页面和许可证都会缺
          cargo package --list -p cmds | grep -qx 'README.md'
          cargo package --list -p cmds | grep -qx 'LICENSE'
          echo "打包内容包含 README.md 与 LICENSE"

      - name: 冒烟测试（Unix）
        if: runner.os != 'Windows'
        run: |
          ./target/release/cmds --version
          ./target/release/cmds -c 'echo ci-ok'
          ./target/release/cmds init bash > /dev/null
          ./target/release/cmds prompt --status 0 > /dev/null

      # 产品对外默认英文。这个检查跑真实进程，两个方向都查：
      # 英文环境不许出现中文，中文环境不许丢中文（否则「把中文删干净」也能过）。
      # CI runner 的 locale 是英文，所以默认语言的回归在这里才抓得准。
      - name: 默认语言（英文环境不得输出中文）
        if: runner.os != 'Windows'
        run: sh scripts/check-cli-language.sh ./target/release/cmds

      - name: 冒烟测试（Windows）
        if: runner.os == 'Windows'
        run: |
          ./target/release/cmds.exe --version
          ./target/release/cmds.exe -c 'echo ci-ok'
          ./target/release/cmds.exe init powershell | Out-Null

  # v0.2.0 的 Linux 包动态链接了构建机（Ubuntu 24.04）的 glibc，产物要求
  # GLIBC_2.39，于是在 Debian 10/11、Ubuntu 18.04~22.04、CentOS 7/8 和各种
  # 开发容器上装完就 `version GLIBC_2.29 not found` ——一键安装等于只有最新
  # Ubuntu 能用，而 CI 全绿。这个 job 把「装完能不能跑」变成发版前就能拦住的约束。
  portability:
    name: Linux 可移植性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl

      # rustup 自带的 musl std 已包含 libc.a 与 crt 对象，项目又没有 C 代码，
      # 所以用 rust-lld 就能出静态产物，不需要 musl-tools 或交叉 gcc。
      - name: 构建 musl 静态产物
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl \
            --config 'target.x86_64-unknown-linux-musl.linker="rust-lld"'

      # 检查逻辑放脚本里（本地也能跑），CI 只负责调用。
      # runner 上有 docker，所以脚本会连「旧发行版容器实跑」那一层一起做。
      - name: 静态断言 + 旧发行版容器实跑
        run: sh scripts/check-linux-portability.sh

      # Release 工作流是用**相对路径**调这个脚本的，而 `docker -v` 只接受绝对路径。
      # 之前 CI 只试了默认的绝对路径，于是同一个脚本 CI 绿、发布红。
      # 这里补上相对路径这条调用方式，把两边的用法都覆盖住。
      - name: 相对路径调用也必须能用（Release 就是这么调的）
        run: sh scripts/check-linux-portability.sh target/x86_64-unknown-linux-musl/release/cmds

      # install.sh 的平台映射必须和 Release 实际产出的资产名对得上，
      # 对不上就会静默退化成 cargo 源码构建（慢且需要 Rust 工具链）。
      - name: install.sh 的 Linux 目标必须以 musl 优先
        run: |
          set -eu
          grep -q 'unknown-linux-musl unknown-linux-gnu' install/install.sh \
            || { echo "::error::install.sh 的 Linux 候选目标不是「musl 优先、gnu 回退」"; exit 1; }
          grep -q 'x86_64-unknown-linux-musl' .github/workflows/release.yml \
            || { echo "::error::release.yml 没有构建 musl 目标"; exit 1; }
          echo "install.sh 与 release.yml 的目标一致"

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # 站点默认英文。用 oxc 的真 AST 找「没走 t() 的中文字面量」——
      # 手写词法分析会被 JSX 正文里的撇号和正则字面量带偏（踩过）。
      - name: 默认语言（源码里不得有裸中文文案）
        working-directory: .
        run: node scripts/check-web-language.mjs web/src/*.js web/src/*.jsx

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: 确认安装脚本随站点一起发布
        run: |
          test -f dist/install.sh
          test -f dist/install.ps1
          test -f dist/index.html

  scripts:
    name: 安装脚本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: sh 语法检查
        run: |
          set -eu
          for f in install/install.sh scripts/*.sh; do
            sh -n "$f"
            echo "sh -n OK: $f"
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning install/install.sh
          # 检查脚本本身用完整模式（不只 warning）：它们是「守门人」，自己出错代价更高。
          # -x 让 shellcheck 跟进 `. scripts/cjk.sh`，否则会因 SC1091 报错。
          #
          # 用通配而不是手写清单：这里原本一个个列脚本名，新增脚本时漏掉了两个，
          # 于是新脚本压根没被检查过。通配让以后新增的自动纳入。
          shellcheck -x scripts/*.sh

      # `$VAR` 紧跟全角标点时，标点的首字节会被当成变量名的一部分：
      # set -u 下直接 unbound variable，没有 set -u 时静默变成空字符串。
      # 这个坑在本仓库踩过三次，而 shellcheck 认为它语法合法、查不出来。
      - name: shell 变量必须用 ${} 界定（紧跟中文标点时）
        run: sh scripts/check-shell-quoting.sh install/install.sh scripts/*.sh

      # `grep '[一-龥]'` 害过两次：先是 CI 上两个 job 因 "Invalid collation
      # character" 恒为假、一片假绿；修完脚本，文档「上线前检查」里还留着同一条
      # 命令，照抄的人拿到的是一条永远打印「正常」的检查。文字规范拦不住复制粘贴。
      - name: 查中文只准用 \p{Han}，不准用 grep 字符区间
        run: sh scripts/check-cjk-detection.sh

      - name: PowerShell 语法检查
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # [ref] 参数必须先声明变量，不能直接传未定义的名字
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path ./install/install.ps1).Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$errors
          )
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1 语法通过（$($tokens.Count) 个 token）"

      # 用户是从 `curl … | sh` 开始接触这个产品的，安装脚本的语言就是第一印象。
      # 检查逻辑放在脚本里而不是写在这里：一份实现、本地也能跑，
      # 而且 grep 对中文区间的 locale 坑只需要处理一次（见 scripts/cjk.sh）。
      - name: 安装脚本默认英文
        run: sh scripts/check-install-language.sh

      # README / SECURITY.md 都承诺「两个安装脚本都会做 SHA-256 校验」。
      # 之前 install.ps1 漏了校验却没人发现，这里把承诺变成可检查的约束。
      - name: 两个安装脚本都必须实现 SHA-256 校验
        run: |
          set -eu
          fail=0
          grep -q 'sha256' install/install.sh || { echo "install.sh 缺少 sha256 校验"; fail=1; }
          grep -q 'skip-verify' install/install.sh || { echo "install.sh 缺少 --skip-verify"; fail=1; }
          grep -qi 'Get-FileHash' install/install.ps1 || { echo "install.ps1 缺少 SHA-256 计算"; fail=1; }
          grep -q 'SkipVerify' install/install.ps1 || { echo "install.ps1 缺少 -SkipVerify"; fail=1; }
          grep -q '\.sha256' install/install.ps1 || { echo "install.ps1 没有下载 .sha256"; fail=1; }
          [ "$fail" -eq 0 ] && echo "两个脚本的校验逻辑都在位"
          exit "$fail"

  docs:
    name: 文档一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # README.md 是英文（crates.io 与 GitHub 首页都用它），中文版单独一份。
      # 两份必须能互相跳转，否则读者会卡在看不懂的那一份上。
      - name: 两份 README 必须互相链接
        run: |
          set -eu
          fail=0
          test -f README.zh-CN.md || { echo "::error::缺少 README.zh-CN.md"; exit 1; }
          grep -q 'blob/master/README.zh-CN.md' README.md \
            || { echo "::error::README.md 里没有指向中文版的链接"; fail=1; }
          grep -q 'blob/master/README.md' README.zh-CN.md \
            || { echo "::error::README.zh-CN.md 里没有回到英文版的链接"; fail=1; }
          [ "$fail" -eq 0 ] && echo "两份 README 互相链接正常"
          exit "$fail"

      # crates.io 渲染 README 时会把相对链接解析到 crates.io 自身，点开是 404。
      # CONTRIBUTING.md 写了这条规则，这里把它变成可检查的约束。
      - name: README 里不能有相对链接
        run: |
          set -eu
          fail=0
          for f in README.md README.zh-CN.md; do
            bad=$(grep -oE '\]\([^)]+\)' "$f" \
              | sed -E 's/^\]\(//; s/\)$//' \
              | grep -vE '^(https?://|#|mailto:)' || true)
            if [ -n "$bad" ]; then
              echo "::error file=$f::存在相对链接，crates.io 上会 404，请改成完整的 https:// URL"
              printf '  %s\n' $bad
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "两份 README 的链接都是绝对地址"
          exit "$fail"

      # 章节数对不上，基本就是改了一侧忘了同步另一侧。
      - name: 两份 README 章节必须一一对应
        run: |
          set -eu
          en=$(grep -c '^#\{2,3\} ' README.md)
          zh=$(grep -c '^#\{2,3\} ' README.zh-CN.md)
          if [ "$en" -ne "$zh" ]; then
            echo "::error::README.md 有 $en 个章节，README.zh-CN.md 有 $zh 个，两侧需同步"
            diff <(grep -n '^#\{2,3\} ' README.md) <(grep -n '^#\{2,3\} ' README.zh-CN.md) || true
            exit 1
          fi
          echo "两份 README 各 $en 个章节，一一对应"
